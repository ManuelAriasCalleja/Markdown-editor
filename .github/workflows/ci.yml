# Continuous integration: compila y ejecuta los tests en los TRES sistemas con
# cada push a main y cada pull request. Es la red de seguridad rápida — el
# release.yml luego se encarga de empaquetar para Linux/Windows/macOS al hacer
# un tag.
#
# La matriz existe porque hasta 2026-07-25 los tests solo corrían en Linux: los
# binarios de Windows y macOS se publicaban sin que se hubiera ejecutado ni una
# prueba sobre ellos (release.yml compila `--target md-editor`, ni siquiera
# construye los tests). Todo lo que depende del sistema —rutas, separadores,
# mayúsculas del sistema de ficheros, fuentes— era terreno ciego.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Que un sistema falle no cancela a los otros dos: interesa ver el cuadro
      # completo en cada push, no el primer fallo.
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
            qt_arch: win64_msvc2022_64
          # macos-14, no macos-latest: la imagen reciente rodó a un SDK que
          # eliminó el framework AGL que los binarios de Qt 6.8.2 todavía
          # referencian (`ld: framework 'AGL' not found`). Misma imagen que usa
          # release.yml para el DMG.
          - name: macOS
            os: macos-14
    steps:
      - uses: actions/checkout@v5

      # Qt 6.8.2 (la misma versión con la que está desarrollado el proyecto).
      # `cache: true` reusa la instalación entre runs del mismo runner image.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          cache: true
          arch: ${{ matrix.qt_arch }}

      # Dependencias del sistema que Qt necesita en runtime (OpenGL para los
      # widgets compuestos, libxkbcommon para teclado, fontconfig para
      # texto). El runner ya trae compilador y CMake. Windows y macOS no
      # necesitan nada de esto.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon0

      # Hunspell para compilar el corrector de verdad (no el stub) y que sus
      # pruebas corran (con un diccionario instalado). Solo en Linux, que es
      # donde release.yml también lo tiene: en Windows y macOS los binarios
      # publicados salen HOY sin corrector, así que la matriz prueba lo que de
      # verdad se distribuye. Si algún día la release los compila con Hunspell,
      # este paso tiene que crecer con ella (`brew install hunspell`, vcpkg).
      # Sin él, SpellChecker es un stub inerte y tst_spellchecker se salta solo.
      - name: Install Hunspell (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libhunspell-dev hunspell-en-us

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # `--parallel 2` (no todos los núcleos): compilar/enlazar las ~50 unidades de
      # test a la vez agota la RAM del runner (cc1plus «Terminated», exit 143). Mismo
      # tope que el job de sanitizers; la release lo evita compilando solo el binario.
      # `--config Release` lo necesita el generador multiconfiguración de Windows
      # (MSVC); en Linux y macOS se ignora.
      - name: Build
        run: cmake --build build --config Release --parallel 2

      # Las pruebas usan QApplication: corren sin pantalla (CMake ya fija la
      # plataforma en cada test, pero lo replicamos por si acaso). En Windows,
      # el plugin nativo en vez de «offscreen»: ver el porqué en CMakeLists,
      # donde está el mismo condicional (offscreen ahí rompe la serialización
      # del énfasis y silencia la salida de QTest).
      # `-C Release`, igual que arriba, es para el generador de Windows.
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'offscreen' }}

      # Un test que se cae ANTES de arrancar (falta una DLL, peta en la
      # inicialización estática) no imprime ni la cabecera de QTest, y
      # --output-on-failure se queda en blanco: no hay nada que enseñar. Con -VV
      # sí aparecen al menos la orden exacta y el directorio de trabajo.
      - name: Re-run failed tests verbosely
        if: failure()
        run: ctest --test-dir build --rerun-failed --output-on-failure -VV -C Release
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'offscreen' }}

      # EXPERIMENTO (temporal). tst_roundtripfuzz —que no está registrado en
      # ctest, ver CMakeLists— revienta en Windows con 0xC0000005 a los 219 ms.
      # Pero se observó con el plugin «offscreen», el mismo que rompía la
      # serialización del énfasis por no montar la base de datos de fuentes: un
      # acceso inválido encaja con desreferenciar un motor de fuente nulo. Se
      # ejecuta con los dos plugins para separar las hipótesis.
      - name: Fuzzer with both platform plugins (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($qpa in @('windows', 'offscreen')) {
            $env:QT_QPA_PLATFORM = $qpa
            $log = Join-Path $env:RUNNER_TEMP "fuzz-$qpa.txt"
            & build/Release/tst_roundtripfuzz.exe -o "$log,txt" 2>&1 | Out-Null
            Write-Host "=== tst_roundtripfuzz con QT_QPA_PLATFORM=$qpa : exit=$LASTEXITCODE"
            if (Test-Path $log) { Get-Content $log | Select-Object -Last 8 | ForEach-Object { Write-Host "    $_" } }
          }
          exit 0

  sanitizers:
    name: Sanitizers (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhunspell-dev hunspell-en-us \
            libgl1-mesa-dev libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon0

      # Build de diagnóstico: instrumenta todo con ASan + UBSan y aborta al primer
      # error de memoria / comportamiento indefinido. Debug para mejores trazas.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON

      # `--parallel 2` (no todos los núcleos): compilar con ASan instrumenta cada
      # TU y dispara mucho la RAM por cc1plus; con todos los núcleos a la vez el
      # runner se queda sin memoria (cc1plus «Killed») en las TUs más pesadas.
      - name: Build
        run: cmake --build build --parallel 2

      # detect_leaks=0: el ruido de fugas a la salida es de Qt/fontconfig, no
      # nuestro; nos interesan los errores de memoria y el UB.
      - name: Test (bajo sanitizers)
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy libhunspell-dev \
            libgl1-mesa-dev libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon0

      # Configurar genera compile_commands.json (CMAKE_EXPORT_COMPILE_COMMANDS) y
      # el código de moc; build asegura que todo lo generado existe.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # `--parallel 2`: igual que arriba, compilar todos los tests a la vez agota la
      # RAM del runner (exit 143). Este job necesita compilar para generar el moc.
      - name: Build
        run: cmake --build build --parallel 2

      # Análisis estático con los checks del .clang-tidy del repo; falla ante
      # cualquier aviso (el código está limpio, así que es una guardia de
      # regresión). Sobre todos los .cpp de src/ (recursivo: viven en
      # subdirectorios por componente); no las pruebas ni el código generado.
      - name: clang-tidy
        run: clang-tidy -p build --warnings-as-errors='*' $(find src -name '*.cpp')
