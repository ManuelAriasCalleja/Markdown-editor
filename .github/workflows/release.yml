# Release: al hacer `git tag v1.2.3 && git push --tags` compila para
# Linux/Windows/macOS en paralelo, empaqueta los tres artefactos y los publica
# como una Release de GitHub con notas autogeneradas a partir de los commits.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # -----------------------------------------------------------------
  # Linux → AppImage (ejecutable único, sin instalación)
  # -----------------------------------------------------------------
  build-linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-x11-0 libfontconfig1 \
            libfuse2 file \
            libhunspell-dev
          # libhunspell-dev: sin él CMake deja HAVE_HUNSPELL sin definir y el
          # corrector viaja como un stub inerte — el programa anuncia corrector y
          # el binario publicado no lo tiene. Trae también el .a, así que el motor
          # va DENTRO del ejecutable y no hay nada de Hunspell que desplegar.
          #
          # Los DICCIONARIOS no se empaquetan en Linux: aquí sí hay del sistema
          # (/usr/share/hunspell), que es de donde los toma cualquier programa del
          # escritorio, y meterlos engordaría el AppImage 5 MB para duplicar lo que
          # el usuario suele tener ya. Si le falta el suyo, el programa se lo dice
          # y le ofrece instalarlo (ver SpellController).

      - name: Configure & build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DSPELL_CHECK_REQUIRED=ON
          # Solo el ejecutable (arrastra md-editor-core), NO los ~44 tests: la
          # release no los necesita (el CI ya los compila y ejecuta) y
          # compilarlos todos con --parallel sin tope agota la RAM del runner
          # (OOM → exit 143). Ver el mismo aprendizaje en ci.yml (sanitizers).
          cmake --build build --parallel --target md-editor

      # `cmake --install` con DESTDIR=AppDir produce un árbol /usr/{bin,share}
      # listo para linuxdeploy. Las reglas install() del CMakeLists ya copian
      # el binario, el .desktop y los iconos hicolor.
      - name: Stage install tree
        run: DESTDIR="$PWD/AppDir" cmake --install build

      # linuxdeploy + plugin-qt empaqueta el AppDir junto con las dependencias
      # de Qt y produce el .AppImage. `--appimage-extract-and-run` evita el
      # requisito de FUSE en algunos runners.
      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage

      - name: Build AppImage
        run: |
          # linuxdeploy-plugin-qt busca `qmake` por PATH; en Qt 6 el binario
          # se llama `qmake6`, así que le pasamos la ruta explícitamente.
          # QT_ROOT_DIR lo exporta install-qt-action al instalar Qt. (Tiene
          # que asignarse aquí, en el shell, no en un bloque env: arriba —
          # los `${{ env.* }}` se evalúan antes de que el action ejecute).
          export QMAKE="$QT_ROOT_DIR/bin/qmake6"

          VERSION="${GITHUB_REF_NAME#v}"
          ./linuxdeploy-x86_64.AppImage \
            --appimage-extract-and-run \
            --appdir=AppDir \
            --output appimage \
            --plugin qt \
            --desktop-file=AppDir/usr/share/applications/md-editor.desktop
          # linuxdeploy genera md-editor-x86_64.AppImage; lo renombramos con
          # versión para que la página de releases muestre nombres claros.
          mv md-editor-*.AppImage "md-editor-${VERSION}-x86_64.AppImage"

      # Paso de humo: hasta aquí NADIE ejecutaba nunca el artefacto que se
      # descarga. El ci.yml compila y prueba el código en los tres sistemas, pero
      # este job construye solo `--target md-editor` y publicaba el AppImage sin
      # arrancarlo ni una vez: un empaquetado incompleto —un plugin de Qt que
      # linuxdeploy no metiera, una librería sin desplegar— pasa las 70 pruebas y
      # llega igual al usuario, porque eso no es código, es el paquete.
      #
      # Se arranca con el plugin `offscreen` (el runner no tiene servidor
      # gráfico) y con un documento, para recorrer la ruta real de uso: arranque,
      # traductores, sesión y carga del Markdown. El programa no tiene una opción
      # tipo `--version` que salga sola (su primer argumento es el archivo a
      # abrir), así que el criterio es: si sigue vivo a los 10 s, arrancó; si ha
      # terminado por su cuenta, se ha caído y se vuelca su salida.
      - name: Smoke test (arrancar el AppImage con un documento)
        run: |
          set -u
          printf '# Prueba\n\nTexto **con formato**, `código` y $E = mc^2$.\n' > smoke.md
          APPIMAGE="$(ls md-editor-*-x86_64.AppImage)"

          # Devuelve 0 si el programa sigue vivo tras arrancar. La salida va a
          # smoke.log para poder volcarla si falla.
          arranca() {
            QT_QPA_PLATFORM=offscreen MD_EDITOR_NO_POPUPS=1 "$@" ./"$APPIMAGE" smoke.md > smoke.log 2>&1 &
            local pid=$!
            sleep 10
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              return 0
            fi
            wait "$pid" 2>/dev/null
            return 1
          }

          if arranca env; then
            echo "OK: el AppImage arrancó y abrió el documento"
            exit 0
          fi

          # Puede ser el runtime, no el paquete: si FUSE falla en el runner, el
          # AppImage no se monta. Se reintenta extrayéndolo, que es lo que ya se
          # hace con linuxdeploy más arriba; si así arranca, el paquete está bien.
          echo "No arrancó montándose; salida:"
          cat smoke.log
          echo "Reintento sin FUSE (APPIMAGE_EXTRACT_AND_RUN=1)..."
          if arranca env APPIMAGE_EXTRACT_AND_RUN=1; then
            echo "OK: arrancó extraído — el paquete está bien, falló el montaje FUSE del runner"
            exit 0
          fi
          echo "El AppImage no arranca. Salida:"
          cat smoke.log
          exit 1

      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: md-editor-*-x86_64.AppImage

  # -----------------------------------------------------------------
  # Windows → ZIP portable (sin instalador, sin firma)
  # -----------------------------------------------------------------
  build-windows:
    name: Windows (ZIP portable)
    runs-on: windows-latest
    # --- Firma de código (opcional, gratuita para OSS vía SignPath Foundation) ---
    # La firma se ACTIVA SOLA en cuanto exista el secreto `SIGNPATH_API_TOKEN`.
    # Sin él, el job compila y publica el ZIP SIN firmar, igual que hasta ahora.
    #
    # Para activarla, una vez aprobado el proyecto en https://signpath.org (programa
    # gratuito para código abierto) y conectado el repo a la app de GitHub de
    # SignPath, define en el repositorio:
    #   • Secret  → SIGNPATH_API_TOKEN              (token de usuario de SignPath)
    #   • Variables (Settings → Secrets and variables → Actions → Variables):
    #       SIGNPATH_ORGANIZATION_ID                (GUID de la organización)
    #       SIGNPATH_PROJECT_SLUG                   (p. ej. "md-editor")
    #       SIGNPATH_POLICY_SLUG                    (p. ej. "release-signing")
    #       SIGNPATH_ARTIFACT_CONFIG_SLUG           (p. ej. "exe")
    env:
      SIGN_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          cache: true
          arch: 'win64_msvc2022_64'

      # Hunspell para el corrector. Se usa el triplete `static-md`: Hunspell
      # estático (viaja dentro del .exe, nada que desplegar) pero con el runtime de
      # C dinámico (/MD), que es como está compilado Qt — mezclar /MT con /MD no
      # enlaza. vcpkg viene preinstalado en el runner.
      - name: Install Hunspell (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install hunspell:x64-windows-static-md
          "HUNSPELL_PREFIX=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" `
            | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure & build
        shell: pwsh
        run: |
          # CMAKE_PREFIX_PATH lleva a Hunspell: en Windows no hay pkg-config, así
          # que lo encuentra el respaldo find_path/find_library del CMakeLists.
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSPELL_CHECK_REQUIRED=ON `
                "-DCMAKE_PREFIX_PATH=$env:HUNSPELL_PREFIX"
          # Solo el ejecutable, no los tests (los cubre el CI): evita OOM del
          # runner al compilar las ~44 unidades de test en paralelo.
          cmake --build build --config Release --parallel --target md-editor

      # windeployqt copia las DLL de Qt, los plugins de QPA, los .qm de
      # traducción y el resto de runtime junto al .exe, en dist/. (El ZIP se
      # comprime después, ya con el .exe firmado si la firma está activa.)
      - name: Stage app (windeployqt)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/md-editor.exe dist/
          & windeployqt.exe --release --no-system-d3d-compiler --no-opengl-sw dist/md-editor.exe

      # Paso de humo, hermano del de Linux: arranca el árbol que va a ir dentro
      # del ZIP. Aquí hay una trampa propia de Windows — install-qt-action mete el
      # Qt del runner en el PATH, y una DLL que windeployqt hubiera olvidado se
      # encontraría por ahí: el paquete pasaría la prueba en el CI y fallaría en la
      # máquina del usuario. Por eso se ejecuta con un PATH mínimo (dist + system32),
      # que es lo más parecido a un Windows limpio.
      - name: Smoke test (arrancar el .exe desplegado)
        shell: pwsh
        run: |
          Set-Content -Path smoke.md -Value "# Prueba`n`nTexto **con formato**, ``código`` y `$E = mc^2`$."
          $env:QT_QPA_PLATFORM = 'offscreen'   # el runner no tiene escritorio
          $env:MD_EDITOR_NO_POPUPS = '1'       # ni avisos que nadie pueda cerrar
          $env:PATH = "$PWD\dist;$env:SystemRoot\System32;$env:SystemRoot"
          $p = Start-Process -FilePath dist\md-editor.exe -ArgumentList 'smoke.md' `
                 -PassThru -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Host "El .exe terminó solo (código $($p.ExitCode)). Salida:"
            Get-Content smoke-out.txt, smoke-err.txt -ErrorAction SilentlyContinue
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "OK: el .exe desplegado arrancó y abrió el documento"

      # --- Firma del .exe (solo si SIGN_ENABLED). El ZIP de abajo recoge el
      #     .exe ya firmado porque SignPath lo devuelve sobre el propio dist/. ---
      - name: Upload unsigned .exe for SignPath
        if: ${{ env.SIGN_ENABLED == 'true' }}
        id: unsigned-exe
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-exe
          path: dist/md-editor.exe

      - name: Sign with SignPath
        if: ${{ env.SIGN_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          # Devuelve el .exe firmado sobre dist/, sustituyendo al sin firmar.
          output-artifact-directory: dist

      # Diccionarios: Windows no tiene ninguno del sistema, así que sin esto el
      # corrector se queda sin nada que consultar. Van junto al .exe, en
      # dictionaries\\, que es la primera ruta que mira SpellChecker::searchPaths.
      - name: Bundle dictionaries
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-dictionaries.sh dist/dictionaries

      - name: Package as portable ZIP
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path dist/* -DestinationPath "md-editor-$version-windows-x64.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: md-editor-*-windows-x64.zip

  # -----------------------------------------------------------------
  # macOS → DMG universal (arm64 + x86_64, sin firma)
  # -----------------------------------------------------------------
  build-macos:
    name: macOS (DMG universal)
    # macos-14 (no macos-latest): la imagen reciente de macos-latest rodó a un SDK
    # nuevo (AppleClang 21) que ELIMINÓ el framework AGL (OpenGL legacy) que la
    # interfaz de enlace de los binarios de Qt 6.8.2 todavía referencia →
    # `ld: framework 'AGL' not found`. macos-14 es la imagen con la que compiló la
    # release v2.1.0 (aún tiene AGL) y construye el universal (x86_64;arm64).
    runs-on: macos-14
    # --- Firma + notarización (opcional, REQUIERE Apple Developer Program, 99 $/año) ---
    # No hay vía gratuita para notarizar; sin esto, el DMG viaja SIN firmar y el
    # usuario lo abre con Ctrl+clic → Abrir (ver «Installing on macOS» en el README).
    #
    # Para activarla, una vez dado de alta en el Apple Developer Program:
    #   1. Crea un certificado «Developer ID Application» y expórtalo a .p12.
    #   2. Genera una contraseña específica de app (appleid.apple.com) para notarytool.
    #   3. Define en el repositorio (Settings → Secrets and variables → Actions):
    #        • MACOS_CERTIFICATE_P12      (el .p12 en base64)
    #        • MACOS_CERTIFICATE_PASSWORD (contraseña del .p12)
    #        • MACOS_SIGNING_IDENTITY     (p. ej. "Developer ID Application: Nombre (TEAMID)")
    #        • MACOS_NOTARY_APPLE_ID      (tu Apple ID)
    #        • MACOS_NOTARY_TEAM_ID       (el Team ID, 10 caracteres)
    #        • MACOS_NOTARY_PASSWORD      (la contraseña específica de app)
    #   4. Reordena el job para: macdeployqt SIN -dmg → codesign del .app → crear el
    #      DMG → notarizar → staple, usando los comandos de referencia siguientes
    #      (dentro de build/):
    #        # Importar el certificado en un llavero temporal
    #        echo "$MACOS_CERTIFICATE_P12" | base64 -d > cert.p12
    #        security create-keychain -p "" build.keychain
    #        security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
    #        security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
    #        security list-keychains -d user -s build.keychain
    #        # Firmar con hardened runtime
    #        codesign --deep --force --options runtime --timestamp \
    #                 --sign "$MACOS_SIGNING_IDENTITY" md-editor.app
    #        # (crear el DMG, p. ej. macdeployqt md-editor.app -dmg)
    #        # Notarizar y grapar el ticket al DMG
    #        xcrun notarytool submit md-editor.dmg --apple-id "$MACOS_NOTARY_APPLE_ID" \
    #              --team-id "$MACOS_NOTARY_TEAM_ID" --password "$MACOS_NOTARY_PASSWORD" --wait
    #        xcrun stapler staple md-editor.dmg
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          cache: true

      # CMAKE_OSX_ARCHITECTURES="arm64;x86_64" produce un binario universal
      # que corre tanto en Apple Silicon como en Intel. Requiere que Qt esté
      # también compilado universal — los binarios oficiales de Qt 6.5+ lo son.
      # Hunspell para el corrector. NO vale `brew install hunspell`: Homebrew lo
      # instala solo para la arquitectura del runner (arm64) y el binario de aquí
      # es universal, así que la mitad x86_64 no enlazaría. Se compila de fuente
      # con las dos arquitecturas de una vez, estático (viaja dentro del binario).
      - name: Build universal Hunspell
        run: |
          curl -sSL --fail --max-time 300 \
            https://github.com/hunspell/hunspell/releases/download/v1.7.2/hunspell-1.7.2.tar.gz \
            | tar xz
          cd hunspell-1.7.2
          ARCHS="-arch arm64 -arch x86_64"
          ./configure --prefix="$PWD/../hunspell-universal" \
            --disable-shared --enable-static --disable-dependency-tracking \
            CFLAGS="$ARCHS -O2" CXXFLAGS="$ARCHS -O2" LDFLAGS="$ARCHS"
          make -j3
          make install
          # Comprobación explícita: si saliera de una sola arquitectura, el enlace
          # del universal fallaría más tarde con un error mucho menos claro.
          lipo -info ../hunspell-universal/lib/libhunspell-1.7.a

      - name: Configure & build (universal)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPELL_CHECK_REQUIRED=ON \
            "-DCMAKE_PREFIX_PATH=$PWD/hunspell-universal" \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          # Solo el ejecutable, no los tests (los cubre el CI): evita OOM del
          # runner al compilar las ~44 unidades de test en paralelo.
          cmake --build build --parallel --target md-editor

      # macdeployqt copia los frameworks de Qt dentro del .app y crea un .dmg
      # con un fondo y la flecha hacia /Applications. Sin firma: el usuario
      # verá un warning de Gatekeeper la primera vez (Ctrl+clic → Abrir).
      - name: Package as DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Diccionarios dentro del bundle (macOS tampoco tiene del sistema):
          # Contents/Resources/dictionaries es donde los busca SpellChecker.
          ./scripts/fetch-dictionaries.sh build/md-editor.app/Contents/Resources/dictionaries
          cd build
          macdeployqt md-editor.app -dmg
          mv md-editor.dmg "../md-editor-${VERSION}-macos-universal.dmg"

      # Paso de humo, hermano del de Linux y el de Windows: arranca el binario de
      # DENTRO del .app (el mismo que monta el usuario desde el DMG). La trampa
      # aquí no es el PATH sino los install names: si macdeployqt no reescribiera
      # alguna referencia, el binario tiraría del Qt del runner por ruta absoluta
      # —arrancaría en el CI y no en el Mac de nadie más—, así que primero se
      # comprueba con otool que no queda ninguna referencia fuera del bundle.
      - name: Smoke test (arrancar el .app empaquetado)
        run: |
          set -u
          APP=build/md-editor.app
          BIN="$APP/Contents/MacOS/md-editor"

          # 1. Ninguna biblioteca puede venir de fuera del bundle (ni del Qt del
          #    runner ni de /usr/local): solo del sistema o de @rpath/@executable_path.
          echo "Dependencias del binario:"
          otool -L "$BIN"
          # Solo las líneas de dependencia (empiezan por espacio; las de cabecera
          # «… (architecture arm64):» del binario universal van a columna 0). Se
          # usa [[:space:]], no \s: el grep de macOS es BSD y no entiende \s.
          if otool -L "$BIN" \
               | grep -E '^[[:space:]]' \
               | grep -vE '@(rpath|executable_path|loader_path)|^[[:space:]]+/usr/lib/|^[[:space:]]+/System/'; then
            echo "Hay dependencias fuera del bundle: el DMG no funcionaría en otro Mac"
            exit 1
          fi

          # 2. Y que arranque de verdad, con un documento y sin escritorio.
          printf '# Prueba\n\nTexto **con formato**, `código` y $E = mc^2$.\n' > smoke.md
          QT_QPA_PLATFORM=offscreen MD_EDITOR_NO_POPUPS=1 "$BIN" smoke.md > smoke.log 2>&1 &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo "OK: el .app empaquetado arrancó y abrió el documento"
          else
            wait "$pid" 2>/dev/null
            echo "El binario del .app terminó solo. Salida:"
            cat smoke.log
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: md-editor-*-macos-universal.dmg

  # -----------------------------------------------------------------
  # Publica la Release con los tres artefactos
  # -----------------------------------------------------------------
  publish:
    name: Publish release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # necesario para crear el Release en este repo
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Notas autogeneradas a partir de los commits desde el tag anterior.
          generate_release_notes: true
          # Marca como prerelease los tags con sufijo (-alpha, -rc, etc.).
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/linux/*
            artifacts/windows/*
            artifacts/macos/*

  # -----------------------------------------------------------------
  # Deja los manifiestos de packaging/ apuntando a la versión recién
  # publicada. Fijan versión y hash de los artefactos, así que quedarse
  # atrás no rompe nada visible: simplemente se sigue instalando una
  # versión vieja (estuvieron seis versiones clavados en la 1.2.0 mientras
  # el README de Scoop publicaba el comando de instalación que los usa).
  # Corre después de `publish` porque lee los artefactos ya subidos.
  # -----------------------------------------------------------------
  packaging:
    name: Update packaging manifests
    needs: publish
    # No en las prereleases (-alpha, -rc…): no deben ser lo que se instala.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # necesario para empujar el commit a main
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0  # hacen falta los tags para resolver tag -> commit

      - name: Update manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-packaging.py "${GITHUB_REF_NAME#v}"

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Los manifiestos ya estaban al día."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [skip ci]: es un cambio de manifiestos, no hay nada que compilar.
          git commit -am "Empaquetado: manifiestos a ${GITHUB_REF_NAME#v} [skip ci]"
          # main pudo avanzar entre el tag y este job.
          git pull --rebase origin main
          git push origin HEAD:main
