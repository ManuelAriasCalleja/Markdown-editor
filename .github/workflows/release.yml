# Release: al hacer `git tag v1.2.3 && git push --tags` compila para
# Linux/Windows/macOS en paralelo, empaqueta los tres artefactos y los publica
# como una Release de GitHub con notas autogeneradas a partir de los commits.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # -----------------------------------------------------------------
  # Linux → AppImage (ejecutable único, sin instalación)
  # -----------------------------------------------------------------
  build-linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-x11-0 libfontconfig1 \
            libfuse2 file

      - name: Configure & build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel

      # `cmake --install` con DESTDIR=AppDir produce un árbol /usr/{bin,share}
      # listo para linuxdeploy. Las reglas install() del CMakeLists ya copian
      # el binario, el .desktop y los iconos hicolor.
      - name: Stage install tree
        run: DESTDIR="$PWD/AppDir" cmake --install build

      # linuxdeploy + plugin-qt empaqueta el AppDir junto con las dependencias
      # de Qt y produce el .AppImage. `--appimage-extract-and-run` evita el
      # requisito de FUSE en algunos runners.
      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage

      - name: Build AppImage
        run: |
          # linuxdeploy-plugin-qt busca `qmake` por PATH; en Qt 6 el binario
          # se llama `qmake6`, así que le pasamos la ruta explícitamente.
          # QT_ROOT_DIR lo exporta install-qt-action al instalar Qt. (Tiene
          # que asignarse aquí, en el shell, no en un bloque env: arriba —
          # los `${{ env.* }}` se evalúan antes de que el action ejecute).
          export QMAKE="$QT_ROOT_DIR/bin/qmake6"

          VERSION="${GITHUB_REF_NAME#v}"
          ./linuxdeploy-x86_64.AppImage \
            --appimage-extract-and-run \
            --appdir=AppDir \
            --output appimage \
            --plugin qt \
            --desktop-file=AppDir/usr/share/applications/md-editor.desktop
          # linuxdeploy genera md-editor-x86_64.AppImage; lo renombramos con
          # versión para que la página de releases muestre nombres claros.
          mv md-editor-*.AppImage "md-editor-${VERSION}-x86_64.AppImage"

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: md-editor-*-x86_64.AppImage

  # -----------------------------------------------------------------
  # Windows → ZIP portable (sin instalador, sin firma)
  # -----------------------------------------------------------------
  build-windows:
    name: Windows (ZIP portable)
    runs-on: windows-latest
    # --- Firma de código (opcional, gratuita para OSS vía SignPath Foundation) ---
    # La firma se ACTIVA SOLA en cuanto exista el secreto `SIGNPATH_API_TOKEN`.
    # Sin él, el job compila y publica el ZIP SIN firmar, igual que hasta ahora.
    #
    # Para activarla, una vez aprobado el proyecto en https://signpath.org (programa
    # gratuito para código abierto) y conectado el repo a la app de GitHub de
    # SignPath, define en el repositorio:
    #   • Secret  → SIGNPATH_API_TOKEN              (token de usuario de SignPath)
    #   • Variables (Settings → Secrets and variables → Actions → Variables):
    #       SIGNPATH_ORGANIZATION_ID                (GUID de la organización)
    #       SIGNPATH_PROJECT_SLUG                   (p. ej. "md-editor")
    #       SIGNPATH_POLICY_SLUG                    (p. ej. "release-signing")
    #       SIGNPATH_ARTIFACT_CONFIG_SLUG           (p. ej. "exe")
    env:
      SIGN_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          cache: true
          arch: 'win64_msvc2022_64'

      - name: Configure & build
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      # windeployqt copia las DLL de Qt, los plugins de QPA, los .qm de
      # traducción y el resto de runtime junto al .exe, en dist/. (El ZIP se
      # comprime después, ya con el .exe firmado si la firma está activa.)
      - name: Stage app (windeployqt)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/md-editor.exe dist/
          & windeployqt.exe --release --no-system-d3d-compiler --no-opengl-sw dist/md-editor.exe

      # --- Firma del .exe (solo si SIGN_ENABLED). El ZIP de abajo recoge el
      #     .exe ya firmado porque SignPath lo devuelve sobre el propio dist/. ---
      - name: Upload unsigned .exe for SignPath
        if: ${{ env.SIGN_ENABLED == 'true' }}
        id: unsigned-exe
        uses: actions/upload-artifact@v5
        with:
          name: unsigned-exe
          path: dist/md-editor.exe

      - name: Sign with SignPath
        if: ${{ env.SIGN_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          # Devuelve el .exe firmado sobre dist/, sustituyendo al sin firmar.
          output-artifact-directory: dist

      - name: Package as portable ZIP
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path dist/* -DestinationPath "md-editor-$version-windows-x64.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: md-editor-*-windows-x64.zip

  # -----------------------------------------------------------------
  # macOS → DMG universal (arm64 + x86_64, sin firma)
  # -----------------------------------------------------------------
  build-macos:
    name: macOS (DMG universal)
    # macos-14 (no macos-latest): la imagen reciente de macos-latest rodó a un SDK
    # nuevo (AppleClang 21) que ELIMINÓ el framework AGL (OpenGL legacy) que la
    # interfaz de enlace de los binarios de Qt 6.8.2 todavía referencia →
    # `ld: framework 'AGL' not found`. macos-14 es la imagen con la que compiló la
    # release v2.1.0 (aún tiene AGL) y construye el universal (x86_64;arm64).
    runs-on: macos-14
    # --- Firma + notarización (opcional, REQUIERE Apple Developer Program, 99 $/año) ---
    # No hay vía gratuita para notarizar; sin esto, el DMG viaja SIN firmar y el
    # usuario lo abre con Ctrl+clic → Abrir (ver «Installing on macOS» en el README).
    #
    # Para activarla, una vez dado de alta en el Apple Developer Program:
    #   1. Crea un certificado «Developer ID Application» y expórtalo a .p12.
    #   2. Genera una contraseña específica de app (appleid.apple.com) para notarytool.
    #   3. Define en el repositorio (Settings → Secrets and variables → Actions):
    #        • MACOS_CERTIFICATE_P12      (el .p12 en base64)
    #        • MACOS_CERTIFICATE_PASSWORD (contraseña del .p12)
    #        • MACOS_SIGNING_IDENTITY     (p. ej. "Developer ID Application: Nombre (TEAMID)")
    #        • MACOS_NOTARY_APPLE_ID      (tu Apple ID)
    #        • MACOS_NOTARY_TEAM_ID       (el Team ID, 10 caracteres)
    #        • MACOS_NOTARY_PASSWORD      (la contraseña específica de app)
    #   4. Reordena el job para: macdeployqt SIN -dmg → codesign del .app → crear el
    #      DMG → notarizar → staple, usando los comandos de referencia siguientes
    #      (dentro de build/):
    #        # Importar el certificado en un llavero temporal
    #        echo "$MACOS_CERTIFICATE_P12" | base64 -d > cert.p12
    #        security create-keychain -p "" build.keychain
    #        security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
    #        security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
    #        security list-keychains -d user -s build.keychain
    #        # Firmar con hardened runtime
    #        codesign --deep --force --options runtime --timestamp \
    #                 --sign "$MACOS_SIGNING_IDENTITY" md-editor.app
    #        # (crear el DMG, p. ej. macdeployqt md-editor.app -dmg)
    #        # Notarizar y grapar el ticket al DMG
    #        xcrun notarytool submit md-editor.dmg --apple-id "$MACOS_NOTARY_APPLE_ID" \
    #              --team-id "$MACOS_NOTARY_TEAM_ID" --password "$MACOS_NOTARY_PASSWORD" --wait
    #        xcrun stapler staple md-editor.dmg
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          cache: true

      # CMAKE_OSX_ARCHITECTURES="arm64;x86_64" produce un binario universal
      # que corre tanto en Apple Silicon como en Intel. Requiere que Qt esté
      # también compilado universal — los binarios oficiales de Qt 6.5+ lo son.
      - name: Configure & build (universal)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          cmake --build build --parallel

      # macdeployqt copia los frameworks de Qt dentro del .app y crea un .dmg
      # con un fondo y la flecha hacia /Applications. Sin firma: el usuario
      # verá un warning de Gatekeeper la primera vez (Ctrl+clic → Abrir).
      - name: Package as DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd build
          macdeployqt md-editor.app -dmg
          mv md-editor.dmg "../md-editor-${VERSION}-macos-universal.dmg"

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: md-editor-*-macos-universal.dmg

  # -----------------------------------------------------------------
  # Publica la Release con los tres artefactos
  # -----------------------------------------------------------------
  publish:
    name: Publish release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # necesario para crear el Release en este repo
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Notas autogeneradas a partir de los commits desde el tag anterior.
          generate_release_notes: true
          # Marca como prerelease los tags con sufijo (-alpha, -rc, etc.).
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/linux/*
            artifacts/windows/*
            artifacts/macos/*
