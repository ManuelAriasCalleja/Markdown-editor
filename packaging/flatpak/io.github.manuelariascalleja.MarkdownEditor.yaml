# BORRADOR de manifiesto Flatpak para Flathub.
#
# Requiere probarlo en local con flatpak-builder y, muy probablemente, pequeños
# ajustes antes de enviarlo a https://github.com/flathub/flathub (ver README.md
# de esta carpeta). No está validado en una build real.
id: io.github.manuelariascalleja.MarkdownEditor
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: md-editor

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Abrir y guardar los .md del usuario (y las imágenes que referencian).
  - --filesystem=home

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - '*.a'

modules:
  - name: md-editor
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/ManuelAriasCalleja/Markdown-editor.git
        tag: v1.2.0
        commit: 351f75a019a87a2356a319849e912cf28d21c734
      - type: file
        path: io.github.manuelariascalleja.MarkdownEditor.metainfo.xml
    # Flathub exige que el .desktop, el icono y el metainfo se llamen como el
    # app-id. El CMake los instala como «md-editor»; aquí los renombramos.
    post-install:
      - install -Dm644 io.github.manuelariascalleja.MarkdownEditor.metainfo.xml /app/share/metainfo/io.github.manuelariascalleja.MarkdownEditor.metainfo.xml
      - mv /app/share/applications/md-editor.desktop /app/share/applications/io.github.manuelariascalleja.MarkdownEditor.desktop
      - desktop-file-edit --set-icon=io.github.manuelariascalleja.MarkdownEditor /app/share/applications/io.github.manuelariascalleja.MarkdownEditor.desktop
      - for s in 16 24 32 48 64 128 256; do mv /app/share/icons/hicolor/${s}x${s}/apps/md-editor.png /app/share/icons/hicolor/${s}x${s}/apps/io.github.manuelariascalleja.MarkdownEditor.png; done
      - mv /app/share/icons/hicolor/scalable/apps/md-editor.svg /app/share/icons/hicolor/scalable/apps/io.github.manuelariascalleja.MarkdownEditor.svg
